<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AushadhiTrack — Medicine Integrity Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>.role-switch{display:flex;padding:3px;background:#f0f6f3;border-radius:8px;gap:2px}.role-switch button{border:0;background:transparent;color:#617573;border-radius:6px;padding:6px 10px;font:700 10px Manrope;cursor:pointer}.role-switch button.active,.role-switch button:hover{background:#fff;color:#087c71;box-shadow:0 1px 3px #26483c18}.login-active .sidebar,.login-active .topbar{display:none}.login-active .main{margin-left:0;width:100%}.login-page{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;background:#f7faf8}.login-card{width:min(500px,calc(100% - 48px));margin:auto;padding:45px 20px}.login-brand{font:800 25px Manrope;color:#182b31;letter-spacing:-1px;display:flex;align-items:center;gap:9px}.login-brand>span{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#087c71;color:white;font-size:20px}.login-brand span:last-child{color:#087c71}.login-eyebrow{font:600 10px 'DM Mono';letter-spacing:.9px;color:#087c71;margin:40px 0 10px}.login-card h1{font:800 34px Manrope;letter-spacing:-1.6px;margin:0}.login-copy{font-size:12px;line-height:1.7;color:#64767b;max-width:390px}.demo-roles{display:grid;gap:10px;margin:28px 0}.demo-roles button{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px;border:1px solid #dfe9e5;border-radius:11px;background:white;color:#182b31;cursor:pointer}.demo-roles button:hover{border-color:#087c71;box-shadow:0 8px 18px #0a564915}.demo-roles b{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#e6f6f0;color:#087c71;font-size:18px}.demo-roles span{display:grid;gap:3px}.demo-roles strong{font:700 12px Manrope}.demo-roles small,.login-note{font:10px Manrope;color:#64767b}.demo-roles i{margin-left:auto;color:#087c71;font-style:normal}.login-note{font:10px 'DM Mono';text-align:center}.login-side{background:#173c38;color:#fff;display:grid;place-items:center;padding:55px}.login-side>div{max-width:300px}.login-seal{display:grid;place-items:center;width:43px;height:43px;border-radius:12px;background:#2d625b;color:#beeb53;font-size:21px}.login-side p{font:700 24px Manrope;line-height:1.38;letter-spacing:-.8px}.login-side small{font:10px 'DM Mono';color:#b7d2cc}@media(max-width:680px){.role-switch,.login-side{display:none}.login-page{display:block}}</style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="AushadhiTrack home"><span class="brand-mark">✚</span><span>Aushadhi<span>Track</span></span></a>
        <p class="brand-sub">Medicine integrity network</p>
        <nav class="nav" id="nav">
          <button class="nav-item active" data-view="admin"><span>▦</span> Command centre</button>
          <button class="nav-item" data-view="batches"><span>⊞</span> Batch registry</button>
          <button class="nav-item" data-view="ledger"><span>▣</span> Audit ledger</button>
          <button class="nav-item" data-view="flags"><span>◉</span> Risk inbox <b id="navRisk">9</b></button>
          <button class="nav-item" data-view="vendor"><span>▤</span> Vendor counter</button>
          <button class="nav-item" data-view="receiver"><span>⌁</span> Receiver portal</button>
        </nav>
        <div class="side-bottom">
          <div class="operator"><div class="avatar">DC</div><div><strong>District Coordinator</strong><small>Demo administrator</small></div><span>⌄</span></div>
          <div class="security-note"><span>◈</span><div><strong>Append-only ledger</strong><small>Prototype audit safeguard active</small></div></div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar"><div id="breadcrumbs">ADMINISTRATION / COMMAND CENTRE</div><div class="role-switch" aria-label="Admin-only: preview other portals" title="Admin-only preview — not available in vendor/receiver sessions"><button data-role="admin">Admin</button><button data-role="vendor">Vendor</button><button data-role="receiver">Receiver</button></div><div class="top-actions"><span class="status-dot"></span><span>System live</span><button class="icon-button" aria-label="Notifications">♧<i>3</i></button></div></header>
        <section id="view-root"></section>
      </main>
    </div>
    <div class="toast" id="toast"></div>
    <div class="modal-backdrop hidden" id="modal"><div class="modal" id="modal-content"></div></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
