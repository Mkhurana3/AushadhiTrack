<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AushadhiTrack — Medicine Integrity Network</title>
    <meta name="description" content="AushadhiTrack: a Jan Aushadhi medicine-integrity prototype for Smart India Hackathon 2026 (SIH26198). Explainable fraud rules, an append-only ledger and citizen bill verification." />
    <meta name="theme-color" content="#087c71" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-active">
    <div class="app-shell">
      <aside class="sidebar">
        <span class="brand"><span class="brand-mark">✚</span><span class="brand-text">Aushadhi<em>Track</em></span></span>
        <p class="brand-sub">Medicine integrity network</p>
        <nav class="nav" id="nav" aria-label="Main"></nav>
        <div class="side-bottom">
          <div class="operator" id="operator"></div>
          <div class="security-note"><span>◈</span><div><strong>Append-only ledger</strong><small>Prototype audit safeguard active</small></div></div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div id="breadcrumbs"></div>
          <div class="role-switch" aria-label="Switch demo role"><button data-role="admin">Admin</button><button data-role="vendor">Vendor</button><button data-role="receiver">Receiver</button></div>
          <div class="top-actions"><span class="status-dot"></span><span class="status-text">Demo live</span>
            <button class="icon-button" data-view-link="flags" aria-label="High-priority flags" title="High-priority flags"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><i id="bell-count">0</i></button></div>
        </header>
        <section id="view-root"></section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop hidden" id="modal"><div class="modal" id="modal-content" role="dialog" aria-modal="true"></div></div>
    <script src="app.js"></script>
  </body>
</html>
