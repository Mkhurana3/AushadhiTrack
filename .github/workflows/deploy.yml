name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install the data pipeline
        run: pip install -r ml/requirements.txt
      - name: Test the data pipeline
        working-directory: ml
        run: python -m pytest -q
      - name: Rebuild the data and check the committed ledger matches
        working-directory: ml
        run: |
          python -m aushadhi_ml --out ../web/src/data
          git diff --exit-code -- ../web/src/data/ledger.json ../web/src/data/master.json
          git diff --stat -- ../web/src/data/model.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web app
        working-directory: web
        run: npm ci
      - name: Type-check, test and build
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npx vite build
      - name: Add the classic version
        run: cp -r classic web/dist/classic

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
